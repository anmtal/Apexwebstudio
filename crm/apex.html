<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Web Studio — Agency Dashboard</title>
  <meta name="theme-color" content="#08090A" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/theme.apex.css" />
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div class="login" id="login">
    <div class="login-card">
      <div class="mark mark--lg" id="loginMark">A</div>
      <h1 id="loginName">Apex Web Studio</h1>
      <p class="sub">Agency Dashboard</p>
      <form id="loginForm">
        <label for="loginEmail">Access key</label>
        <input class="field-input" type="password" id="loginEmail" placeholder="••••••••" />
        <div style="height:14px"></div>
        <button class="btn btn--block" type="submit"><i class="fa-solid fa-arrow-right-to-bracket"></i> Enter Dashboard</button>
      </form>
      <p class="login-hint" id="loginHint"><i class="fa-solid fa-circle-info"></i> Demo mode — click Enter to explore with sample data.</p>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div class="app hidden" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <div class="mark mark--sm" id="brandMark">A</div>
        <div class="n" id="brandName">Apex Web Studio<small>Agency Dashboard</small></div>
      </div>
      <nav class="side-nav" id="sideNav">
        <a data-tab="overview" class="active"><i class="fa-solid fa-gauge-high"></i> Overview</a>
        <a data-tab="bookings"><i class="fa-solid fa-inbox"></i> Leads <span class="badge" id="navBookings">0</span></a>
        <a data-tab="clients"><i class="fa-solid fa-users"></i> Clients</a>
        <a data-tab="messages"><i class="fa-solid fa-comment-dots"></i> Messages <span class="badge" id="navMessages">0</span></a>
        <a data-tab="insights"><i class="fa-solid fa-chart-line"></i> Insights</a>
        <a data-tab="reviews"><i class="fa-solid fa-star"></i> Reviews</a>
        <a data-tab="settings"><i class="fa-solid fa-gear"></i> Settings</a>
      </nav>
      <div class="side-foot">
        <div class="plan-card" id="planCard">
          <div class="lbl">Your plan</div>
          <div class="amt" id="planAmt">$0<span>/mo</span></div>
          <div class="roi" id="planRoi"></div>
        </div>
        <div class="side-owner">
          <div class="avatar" id="ownerAv">A</div>
          <div class="who" id="ownerWho">Apex<small>Owner</small></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>
        <div class="tb-title" id="tbTitle">Overview<small id="tbSub">Website & lead insights</small></div>
        <div class="tb-right">
          <label class="search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="globalSearch" placeholder="Search leads, clients…" /></label>
          <span class="live"><span class="dot"></span> Live</span>
          <button class="icon-btn"><i class="fa-regular fa-bell"></i><span class="dot"></span></button>
        </div>
      </header>

      <div class="views" id="views">
        <section class="view" data-view="overview"></section>
        <section class="view hidden" data-view="bookings"></section>
        <section class="view hidden" data-view="clients"></section>
        <section class="view hidden" data-view="messages"></section>
        <section class="view hidden" data-view="insights"></section>
        <section class="view hidden" data-view="reviews"></section>
        <section class="view hidden" data-view="settings"></section>
      </div>
    </main>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-label="Lead detail"></aside>
  <div class="splash" id="splash"></div>

  <script src="js/config.apex.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
